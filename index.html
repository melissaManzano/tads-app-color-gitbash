<!DOCTYPE html>
<html lang="es">

<head>
<!-- Comentario de prueba -->

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RGB Color Studio</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="container py-5">

        <!-- Encabezado -->
        <div class="text-center mb-5">

            <div class="app-icon mx-auto mb-3">
                <i class="bi bi-palette-fill"></i>
            </div>

            <h1 class="app-title">
                RGB Color Studio
            </h1>

            <p class="app-description">
                Mezcla los canales rojo, verde y azul para crear tu color.
            </p>

        </div>


        <!-- Aplicación -->
        <div class="color-app">

            <div class="row g-0">


                <!-- Vista previa -->
                <div class="col-12 col-lg-5 preview-section">

                    <p class="section-label">
                        Vista previa
                    </p>

                    <div
                        id="colorBox"
                        class="color-preview">
                    </div>


                    <div class="color-info">

                        <div class="color-code-main">

                            <span class="code-label">
                                HEX
                            </span>

                            <span id="hexCode" class="hex-code">
                                #000000
                            </span>

                        </div>


                        <div class="rgb-result">

                            <span class="code-label">
                                RGB
                            </span>

                            <span id="rgbCode">
                                rgb(0, 0, 0)
                            </span>

                        </div>

                    </div>

                </div>



                <!-- Controles -->
                <div class="col-12 col-lg-7 controls-section">

                    <div class="controls-header">

                        <div>

                            <p class="section-label mb-1">
                                Mezclador RGB
                            </p>

                            <h2>
                                Ajusta tu color
                            </h2>

                        </div>


                        <button
                            id="resetButton"
                            class="btn-reset"
                            type="button"
                            title="Restablecer valores RGB">

                            <i class="bi bi-arrow-counterclockwise"></i>

                            Restablecer

                        </button>

                    </div>



                    <!-- ROJO -->
                    <div class="channel-card red-channel">

                        <div class="channel-header">

                            <div class="channel-name">

                                <span class="channel-dot"></span>

                                <div>
                                    <span class="channel-title">
                                        Rojo
                                    </span>

                                    <span class="channel-letter">
                                        R
                                    </span>
                                </div>

                            </div>


                            <div class="number-wrapper">

                                <label
                                    for="redInput"
                                    class="visually-hidden">
                                    Valor decimal rojo
                                </label>

                                <input
                                    type="number"
                                    class="rgb-number"
                                    id="redInput"
                                    min="0"
                                    max="255"
                                    value="0"
                                    title="Valor decimal rojo"
                                >

                                <span class="number-max">
                                    / 255
                                </span>

                            </div>

                        </div>


                        <label
                            for="red"
                            class="visually-hidden">
                            Control deslizante rojo
                        </label>

                        <input
                            type="range"
                            class="form-range rgb-slider slider-red"
                            id="red"
                            min="0"
                            max="255"
                            value="0"
                            title="Control deslizante rojo"
                        >

                    </div>



                    <!-- VERDE -->
                    <div class="channel-card green-channel">

                        <div class="channel-header">

                            <div class="channel-name">

                                <span class="channel-dot"></span>

                                <div>
                                    <span class="channel-title">
                                        Verde
                                    </span>

                                    <span class="channel-letter">
                                        G
                                    </span>
                                </div>

                            </div>


                            <div class="number-wrapper">

                                <label
                                    for="greenInput"
                                    class="visually-hidden">
                                    Valor decimal verde
                                </label>

                                <input
                                    type="number"
                                    class="rgb-number"
                                    id="greenInput"
                                    min="0"
                                    max="255"
                                    value="0"
                                    title="Valor decimal verde"
                                >

                                <span class="number-max">
                                    / 255
                                </span>

                            </div>

                        </div>


                        <label
                            for="green"
                            class="visually-hidden">
                            Control deslizante verde
                        </label>

                        <input
                            type="range"
                            class="form-range rgb-slider slider-green"
                            id="green"
                            min="0"
                            max="255"
                            value="0"
                            title="Control deslizante verde"
                        >

                    </div>



                    <!-- AZUL -->
                    <div class="channel-card blue-channel">

                        <div class="channel-header">

                            <div class="channel-name">

                                <span class="channel-dot"></span>

                                <div>
                                    <span class="channel-title">
                                        Azul
                                    </span>

                                    <span class="channel-letter">
                                        B
                                    </span>
                                </div>

                            </div>


                            <div class="number-wrapper">

                                <label
                                    for="blueInput"
                                    class="visually-hidden">
                                    Valor decimal azul
                                </label>

                                <input
                                    type="number"
                                    class="rgb-number"
                                    id="blueInput"
                                    min="0"
                                    max="255"
                                    value="0"
                                    title="Valor decimal azul"
                                >

                                <span class="number-max">
                                    / 255
                                </span>

                            </div>

                        </div>


                        <label
                            for="blue"
                            class="visually-hidden">
                            Control deslizante azul
                        </label>

                        <input
                            type="range"
                            class="form-range rgb-slider slider-blue"
                            id="blue"
                            min="0"
                            max="255"
                            value="0"
                            title="Control deslizante azul"
                        >

                    </div>



                    <!-- Información -->
                    <div class="info-message">

                        <i class="bi bi-info-circle"></i>

                        <p>
                            Mueve los controles o escribe directamente
                            un valor entre <strong>0 y 255</strong>.
                            Ambos métodos están sincronizados.
                        </p>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript personalizado -->
    <script src="js/script.js"></script>

</body>

</html>
